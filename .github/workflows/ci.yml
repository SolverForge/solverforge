name: CI

on:
  push:
    branches: [main, dev, release/*, feature/*]
  pull_request:
    branches: [main, dev, release/*]
  # The Release workflow runs this same CI on the tagged commit before it
  # publishes anything.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: ${{ github.server_url == 'https://github.com' }}
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml names the toolchain and its components.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      # Doctests already ran above with --all-features; this checks they also
      # build with the default feature set.
      - name: Run doc tests with default features
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc
