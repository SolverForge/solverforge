name: CI

on:
  push:
    branches: [main, dev, release/*, feature/*]
  pull_request:
    branches: [main, dev, release/*]
  # The Release workflow runs this same CI on the tagged commit before it
  # publishes anything.
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    if: ${{ github.server_url == 'https://github.com' }}
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml names the toolchain and its components.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      # Doctests already ran above with --all-features; this checks they also
      # build with the default feature set.
      - name: Run doc tests with default features
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc

  msrv:
    if: ${{ github.server_url == 'https://github.com' }}
    name: MSRV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The workspace `rust-version` is the declared minimum; check it with
      # exactly that toolchain.
      - name: Check with the declared minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --workspace --all-targets --all-features --locked

  docs:
    if: ${{ github.server_url == 'https://github.com' }}
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install

      - name: Build API docs with warnings denied
        run: cargo doc --workspace --no-deps --all-features --locked

      # Wireframes and guides may only name types that exist.
      - name: Check documented type names
        run: python3 scripts/check-doc-names.py

      # AGENTS.md: Rust source and test files stay within 500 lines.
      - name: Check Rust file lengths
        run: python3 scripts/check-file-length.py

      # Every type a facade signature uses must be importable from solverforge.
      - name: Check facade reachability
        run: python3 scripts/check-facade-reachability.py

      # Every change to the core, scoring or solver public API updates its snapshot.
      - name: Check public API snapshots
        run: python3 scripts/check-public-api.py

  package:
    if: ${{ github.server_url == 'https://github.com' }}
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install

      # The same packaging the Release workflow runs before it publishes.
      - name: Package every publishable crate
        run: make publish-crates-dry
