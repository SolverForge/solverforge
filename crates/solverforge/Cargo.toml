[package]
name = "solverforge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
rust-version.workspace = true
description = "SolverForge - A constraint solver in Rust"

[features]
default = []
serde = ["solverforge-core/serde"]
console = ["dep:solverforge-console"]
# Console output at DEBUG level; implies `console`.
verbose-logging = ["console", "solverforge-console/verbose-logging"]

[dependencies]
solverforge-core = { version = "=0.23.0", path = "../solverforge-core" }
solverforge-macros = { version = "=0.23.0", path = "../solverforge-macros" }
solverforge-scoring = { version = "=0.23.0", path = "../solverforge-scoring" }
solverforge-solver = { version = "=0.23.0", path = "../solverforge-solver" }
solverforge-config = { version = "=0.23.0", path = "../solverforge-config" }

solverforge-cvrp = { version = "=0.23.0", path = "../solverforge-cvrp" }

# Console output (optional)
solverforge-console = { version = "=0.23.0", path = "../solverforge-console", optional = true }

[dev-dependencies]
serde.workspace = true
toml.workspace = true
