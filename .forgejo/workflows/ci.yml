name: CI

on:
  push:
    branches: [main, dev, release/*, feature/*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: rust

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup default "$toolchain"

      - name: Configure Python for PyO3
        run: |
          PYTHON_BIN="$(command -v python3 || command -v python)"
          echo "PYO3_PYTHON=${PYTHON_BIN}" >> "$GITHUB_ENV"
          echo "PYTHON_SYS_EXECUTABLE=${PYTHON_BIN}" >> "$GITHUB_ENV"

      # Runner environment overrides workflow-level CARGO_TARGET_DIR. Set it on
      # each Cargo process so trybuild's generated crate stays under this workspace
      # and planning_model! can find its workspace-relative UI fixture roots.
      - name: Check formatting
        run: CARGO_TARGET_DIR="$PWD/target" cargo fmt --all -- --check

      - name: Run clippy
        run: CARGO_TARGET_DIR="$PWD/target" cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: CARGO_TARGET_DIR="$PWD/target" cargo build --workspace --all-features

      - name: Run tests
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --workspace --all-features

      - name: Run integration tests
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --workspace --all-features --test '*'

      - name: Run doc tests
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --workspace --doc
