# csemver — native release configuration.
# Replaces the retired .versionrc.json and scripts/version/* JavaScript updaters:
# every surface uses a native updater (toml line reader or a POSIX ERE regex with
# an explicit version capture group). Bump entries apply in order, re-reading each
# file from disk, so several entries may target one file to move every documented
# version surface. versionGroup names the span csemver replaces; prefix and suffix
# groups are preserved verbatim.

header = """
# Changelog

All notable changes to this project will be documented in this file."""

tagPrefix = "v"
commitAll = true
releaseCommitMessageFormat = "chore(release): {{currentTag}}"
commitUrlFormat = "https://github.com/SolverForge/solverforge/commit/{{hash}}"
compareUrlFormat = "https://github.com/SolverForge/solverforge/compare/{{previousTag}}...{{currentTag}}"

packageFiles = [
  # Reads the workspace version (the single source of truth; every crate
  # manifest inherits it through version.workspace = true).
  { filename = "Cargo.toml", type = "toml" },
]

bumpFiles = [
  # Workspace version.
  { filename = "Cargo.toml", type = "toml" },
  # Internal path-dependency versions in the non-leaf crate manifests move
  # through the postbump script below (they are exact `=x.y.z` requirements,
  # so macro output always meets the facade it was built with): the native
  # regex updater replaces only
  # the first match per entry, and each manifest carries several dependency
  # lines. The script reads the already-bumped workspace version out of
  # Cargo.toml, rewrites every internal path-dep line to it, then regenerates
  # Cargo.lock and docs/architecture.html.
  # Centrally documented version surfaces in AGENTS.md and README.md; README
  # carries three surfaces (status line, install snippet, console banner).
  { filename = "AGENTS.md", type = 'regex', pattern = '(Current workspace release version: `)([^`]*)(`)', versionGroup = 2 },
  { filename = "README.md", type = 'regex', pattern = '(Current workspace version:\*\* )([0-9]+\.[0-9]+\.[0-9]+)', versionGroup = 2 },
  { filename = "README.md", type = 'regex', pattern = '(solverforge = \{ version = ")([0-9]+\.[0-9]+\.[0-9]+)(", features = \["console"\])', versionGroup = 2 },
  { filename = "README.md", type = 'regex', pattern = '(\bv)([0-9]+\.[0-9]+\.[0-9]+)( - Zero-Erasure Constraint Solver)', versionGroup = 2 },
  # Per-crate wireframe release line.
  { filename = "crates/solverforge/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-core/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-macros/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-scoring/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-config/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-solver/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-bridge/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-cvrp/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
  { filename = "crates/solverforge-console/WIREFRAME.md", type = 'regex', pattern = '(\*\*Workspace Release:\*\* `)([^`]*)(`)', versionGroup = 2 },
]

[scripts]
# Cargo.lock cannot be handled by a first-match regex updater (every workspace
# crate block carries the version), and the internal path-dependency lines move
# as a group, so the postbump script rewrites them from the bumped workspace
# version, regenerates the lock, and rebuilds the architecture page.
postbump = """new_version=$(awk '/^version = / { gsub(/\"/, \"\", $3); print $3; exit }' Cargo.toml) && sed -i -E \"s|(version = \\"=)[0-9]+\\.[0-9]+\\.[0-9]+(\\", path = \\"\\.\\./solverforge-)|\\1${new_version}\\2|\" crates/*/Cargo.toml && cargo update --workspace --offline && node scripts/solverforge-architecture.js && git add Cargo.lock docs/architecture.html crates/*/Cargo.toml"""
