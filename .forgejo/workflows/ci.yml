name: CI

on:
  push:
    branches: [main, dev, release/*, feature/*]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: rust

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the toolchain and its components.
      - name: Install Rust toolchain
        run: rustup toolchain install

      # Runner environment overrides workflow-level CARGO_TARGET_DIR. Set it on
      # each Cargo process so trybuild's generated crate stays under this workspace
      # and planning_model! can find its workspace-relative UI fixture roots.
      - name: Check formatting
        run: CARGO_TARGET_DIR="$PWD/target" cargo fmt --all -- --check

      - name: Run clippy
        run: CARGO_TARGET_DIR="$PWD/target" cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: CARGO_TARGET_DIR="$PWD/target" cargo build --workspace --all-features

      - name: Run tests
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --workspace --all-features

      # Doctests already ran above with --all-features; this checks they also
      # build with the default feature set.
      - name: Run doc tests with default features
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --workspace --doc

      - name: Check with the declared minimum Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          CARGO_TARGET_DIR="$PWD/target/msrv" cargo +"$msrv" check --workspace --all-targets --all-features --locked

      - name: Build API docs with warnings denied
        run: RUSTDOCFLAGS="-D warnings" CARGO_TARGET_DIR="$PWD/target" cargo doc --workspace --no-deps --all-features --locked

      - name: Check documented type names
        run: python3 scripts/check-doc-names.py

      # AGENTS.md: Rust source and test files stay within 500 lines.
      - name: Check Rust file lengths
        run: python3 scripts/check-file-length.py

      # Every type a facade signature uses must be importable from solverforge.
      - name: Check facade reachability
        run: python3 scripts/check-facade-reachability.py

      - name: Package every publishable crate
        run: CARGO_TARGET_DIR="$PWD/target" make publish-crates-dry
